spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hmac-sha256
      expiration: 86400000
  kafka:
    bootstrap-servers: localhost:9092

springdoc:
  api-docs:
    enabled: false
